name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Verificar y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar, verificar, auditar y compilar
        run: make ci

      - name: Subir sitio estático como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 7
